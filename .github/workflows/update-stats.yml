name: Update GitHub stats

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours (UTC)
  workflow_dispatch:         # manual run from the Actions tab
  push:
    branches: [main]
    paths:
      - generate-stats.js
      - package.json

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate SVG
        env:
          GITHUB_USERNAME: ashishsahoo18
          # Prefer a PAT stored as STATS_TOKEN (needed for reliable contribution data);
          # fall back to the built-in token, which still gives repos/stars/followers/languages.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: node generate-stats.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg
          git diff --staged --quiet || git commit -m "chore: update github-stats.svg"
          git push
